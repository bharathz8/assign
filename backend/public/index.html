<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Drive File Explorer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .auth-container {
      margin-bottom: 20px;

      .download-button {
        display: inline-block;
        background-color: #4285F4;
        color: white;
        padding: 8px 15px;
        border-radius: 4px;
        text-decoration: none;
        margin-top: 10px;
      }

      #ocrAnalysisSection {
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid #eee;
      }

      #runOCRButton {
        background-color: #34A853;
      }

      #ocrResults {
        margin-top: 15px;
        padding: 15px;
        background-color: #f5f5f5;
        border-radius: 4px;
      }

      .ocr-summary {
        margin-bottom: 15px;
      }

      .relevant {
        color: #34A853;
        font-weight: bold;
      }

      .not-relevant {
        color: #EA4335;
      }

      .extracted-text-container {
        max-height: 200px;
        overflow-y: auto;
        background-color: #fff;
        padding: 10px;
        border: 1px solid #ddd;
        margin-top: 10px;
      }

      .extracted-text-container pre {
        white-space: pre-wrap;
        font-family: monospace;
        font-size: 0.9em;
      }
    }

    button {
      background-color: #4285F4;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #3367D6;
    }

    .file-list {
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 0;
    }

    .file-item {
      padding: 12px 20px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .file-item:last-child {
      border-bottom: none;
    }

    .file-item:hover {
      background-color: #f9f9f9;
    }

    .file-icon {
      margin-right: 10px;
    }

    .file-details {
      flex-grow: 1;
    }

    .file-name {
      font-weight: bold;
    }

    .file-meta {
      color: #666;
      font-size: 0.85em;
      margin-top: 4px;
    }

    .file-actions a {
      text-decoration: none;
      color: #4285F4;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #666;
    }

    .error {
      color: #d32f2f;
      background-color: #ffeaea;
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 20px;
    }

    .file-details-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
    }

    .modal-content {
      background-color: white;
      margin: 10% auto;
      padding: 20px;
      width: 60%;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .close {
      float: right;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
    }

    .status {
      padding: 10px;
      margin-bottom: 20px;
      border-radius: 4px;
    }

    .success {
      background-color: #e6f7e6;
      color: #2e7d32;
    }
  </style>
</head>

<body>
  <div class="header">
    <h1>Google Drive File Explorer</h1>
  </div>

  <div id="statusMessage" style="display: none;" class="status"></div>

  <div class="auth-container">
    <button id="authButton">Authenticate with Google Drive</button>
  </div>

  <div id="content">
    <div id="errorContainer" class="error" style="display: none;"></div>

    <button id="fetchFilesButton" style="display: none;">Fetch Files</button>

    <div id="loadingIndicator" class="loading" style="display: none;">
      Loading files from Google Drive...
    </div>

    <div id="fileList" class="file-list"></div>
  </div>

  <div id="fileDetailsModal" class="file-details-modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2>File Details</h2>
      <div id="fileDetailsContent"></div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const authButton = document.getElementById('authButton');
      const fetchFilesButton = document.getElementById('fetchFilesButton');
      const fileList = document.getElementById('fileList');
      const loadingIndicator = document.getElementById('loadingIndicator');
      const errorContainer = document.getElementById('errorContainer');
      const fileDetailsModal = document.getElementById('fileDetailsModal');
      const fileDetailsContent = document.getElementById('fileDetailsContent');
      const closeModalButton = document.querySelector('.close');
      const statusMessage = document.getElementById('statusMessage');
  
      // Inject missing assets container & button
      const missingAssetsSection = document.createElement('div');
      missingAssetsSection.innerHTML = `
        <button id="viewMissingAssetsButton">View Missing Assets</button>
        <div id="missingAssetsContainer" style="margin-top: 20px;"></div>
      `;
      document.getElementById('content').prepend(missingAssetsSection);
  
      // Handle missing assets button click
      document.getElementById('viewMissingAssetsButton').addEventListener('click', async () => {
        const container = document.getElementById('missingAssetsContainer');
        container.innerHTML = 'Loading...';
  
        try {
          const res = await fetch('/missing-assets');
          const data = await res.json();
  
          container.innerHTML = `
            <h3>Missing Bank Accounts</h3>
            <ul>${data.missing_bank_accounts.map(a => `<li>${a.name}</li>`).join('')}</ul>
  
            <h3>Missing Insurance Policies</h3>
            <ul>${data.missing_insurances.map(a => `<li>${a.name}</li>`).join('')}</ul>
  
            <h3>Missing Vehicle Policies</h3>
            <ul>${data.missing_vehicle_policies.map(a => `<li>${a.name}</li>`).join('')}</ul>
          `;
        } catch (err) {
          container.innerHTML = `<p style="color:red;">Failed to fetch missing assets</p>`;
        }
      });
  
      // Check URL parameters for auth status
      const urlParams = new URLSearchParams(window.location.search);
      const authStatus = urlParams.get('auth');
  
      if (authStatus === 'success') {
        statusMessage.textContent = 'Successfully authenticated with Google Drive!';
        statusMessage.classList.add('success');
        statusMessage.style.display = 'block';
        fetchFilesButton.style.display = 'block';
        window.history.replaceState({}, document.title, '/');
      } else if (authStatus === 'error') {
        errorContainer.textContent = 'Authentication failed. Please try again.';
        errorContainer.style.display = 'block';
        window.history.replaceState({}, document.title, '/');
      }
  
      authButton.addEventListener('click', async () => {
        try {
          const response = await fetch('/api/auth/url');
          const data = await response.json();
          window.location.href = data.url;
        } catch (error) {
          errorContainer.textContent = 'Failed to generate authentication URL.';
          errorContainer.style.display = 'block';
        }
      });
  
      fetchFilesButton.addEventListener('click', fetchFiles);
  
      function fetchFiles() {
        fileList.innerHTML = '';
        loadingIndicator.style.display = 'block';
        errorContainer.style.display = 'none';
  
        fetch('/api/files')
          .then(response => {
            if (!response.ok) throw new Error('Failed to fetch files');
            return response.json();
          })
          .then(files => {
            loadingIndicator.style.display = 'none';
  
            if (files.length === 0) {
              fileList.innerHTML = '<div class="file-item">No files found</div>';
              return;
            }
  
            files.forEach(file => {
              const fileItem = document.createElement('div');
              fileItem.className = 'file-item';
  
              const fileType = getFileType(file.mimeType);
              const fileSize = file.size ? formatFileSize(file.size) : 'N/A';
              const modifiedDate = new Date(file.modifiedTime).toLocaleDateString();
  
              fileItem.innerHTML = `
                <div class="file-details">
                  <div class="file-name">${file.name}</div>
                  <div class="file-meta">
                    ${fileType} • Modified: ${modifiedDate} • ${fileSize}
                  </div>
                </div>
                <div class="file-actions">
                  <a href="#" class="view-details" data-file-id="${file.id}">View Details</a><br>
                  <a href="#" class="run-analysis" data-file-id="${file.id}">Run Analysis</a><br>
                  ${file.webViewLink ? `<a href="${file.webViewLink}" target="_blank">Open in Drive</a>` : ''}
                </div>
              `;
  
              fileList.appendChild(fileItem);
            });
  
            document.querySelectorAll('.view-details').forEach(link => {
              link.addEventListener('click', function (e) {
                e.preventDefault();
                const fileId = this.getAttribute('data-file-id');
                viewFileDetails(fileId);
              });
            });
  
            document.querySelectorAll('.run-analysis').forEach(link => {
              link.addEventListener('click', function (e) {
                e.preventDefault();
                const fileId = this.getAttribute('data-file-id');
                runAnalysis(fileId);
              });
            });
          })
          .catch(error => {
            loadingIndicator.style.display = 'none';
            errorContainer.textContent = 'Failed to fetch files. Please authenticate again.';
            errorContainer.style.display = 'block';
            console.error('Error:', error);
          });
      }
  
      function runAnalysis(fileId) {
        fileDetailsContent.innerHTML = 'Running analysis...';
        fileDetailsModal.style.display = 'block';
  
        fetch(`/api/files/${fileId}/analyze`)
          .then(res => res.json())
          .then(data => {
            fileDetailsContent.innerHTML = `
              <p><strong>File:</strong> ${data.fileName}</p>
              <p><strong>Type Detected:</strong> ${data.documentType} (${data.documentTypeConfidence}%)</p>
              <p><strong>Relevance:</strong> ${data.isRelevant ? 'Relevant ✅' : 'Not Relevant ❌'}</p>
              <p><strong>Extracted Data:</strong></p>
              <pre>${JSON.stringify(data.structuredData.data, null, 2)}</pre>
              <p><strong>Saved to DB:</strong> ${data.savedToDatabase?.success ? '✅' : '❌'} ${data.savedToDatabase?.message || ''}</p>
            `;
          })
          .catch(err => {
            fileDetailsContent.innerHTML = `<p style="color:red;">Analysis failed.</p>`;
            console.error('Analysis error:', err);
          });
      }
  
      function viewFileDetails(fileId) {
        fileDetailsContent.innerHTML = 'Loading...';
        fileDetailsModal.style.display = 'block';
  
        fetch(`/api/files/${fileId}`)
          .then(response => response.json())
          .then(file => {
            const fileType = getFileType(file.mimeType);
            const fileSize = file.size ? formatFileSize(file.size) : 'N/A';
            const createdDate = new Date(file.createdTime).toLocaleString();
            const modifiedDate = new Date(file.modifiedTime).toLocaleString();
            const owners = file.owners ? file.owners.map(owner => owner.displayName).join(', ') : 'Unknown';
  
            fileDetailsContent.innerHTML = `
              <p><strong>Name:</strong> ${file.name}</p>
              <p><strong>Type:</strong> ${fileType}</p>
              <p><strong>Size:</strong> ${fileSize}</p>
              <p><strong>Created:</strong> ${createdDate}</p>
              <p><strong>Modified:</strong> ${modifiedDate}</p>
              <p><strong>Owner(s):</strong> ${owners}</p>
              <p><strong>Description:</strong> ${file.description || 'No description'}</p>
              ${file.webViewLink ? `<p><a href="${file.webViewLink}" target="_blank">Open in Google Drive</a></p>` : ''}
            `;
          })
          .catch(error => {
            fileDetailsContent.innerHTML = 'Failed to load file details.';
            console.error('Error:', error);
          });
      }
  
      closeModalButton.addEventListener('click', () => {
        fileDetailsModal.style.display = 'none';
      });
  
      window.addEventListener('click', (event) => {
        if (event.target === fileDetailsModal) {
          fileDetailsModal.style.display = 'none';
        }
      });
  
      function getFileType(mimeType) {
        const mimeTypes = {
          'application/vnd.google-apps.document': 'Google Doc',
          'application/vnd.google-apps.spreadsheet': 'Google Sheet',
          'application/vnd.google-apps.presentation': 'Google Slides',
          'application/vnd.google-apps.folder': 'Folder',
          'application/pdf': 'PDF',
          'image/jpeg': 'JPEG Image',
          'image/png': 'PNG Image',
          'text/plain': 'Text File',
          'application/zip': 'ZIP Archive'
        };
  
        return mimeTypes[mimeType] || mimeType.split('/')[1] || 'Unknown';
      }
  
      function formatFileSize(bytes) {
        if (bytes === 0) return '0 Bytes';
        const k = 1024;
        const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
      }
    });
  </script>
  
</body>

</html>
